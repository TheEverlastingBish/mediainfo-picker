[project]
name = "mediainfo-picker"
version = "0.1.0"
description = "Pick which MediaInfo fields to show for a media file, and copy the output or the command that makes it"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/mediainfo_picker/data/mediainfo-csv/LICENSE"]
authors = [{ name = "Bish Sinha" }]
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.5"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Topic :: Multimedia :: Video",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/TheEverlastingBish/mediainfo-picker"

[project.scripts]
mediainfo-picker = "mediainfo_picker.app:main"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    "pytest>=8",
    "ruff==0.17.5",  # keep in step with the ruff-pre-commit rev in .pre-commit-config.yaml
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mediainfo_picker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "B",    # bugbear: likely bugs
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import order
    "PIE",  # unnecessary code
    "PLE",  # pylint errors
    "PLW",  # pylint warnings
    "RUF",  # ruff's own
    "SIM",  # simplifications
    "UP",   # newer syntax for the target version
    "W",    # pycodestyle warnings
]

[tool.ruff.lint.isort]
known-first-party = ["mediainfo_picker"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true
