# The same checks as pre-commit, on every pull request and on main, on Linux, Windows and macOS.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # nothing here pushes; don't leave the token in .git/config
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.14"]  # the oldest supported and the newest
    env:
      REQUIRE_MEDIAINFO: "1"  # a missing mediainfo fails the run instead of skipping the live tests
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # nothing here pushes; don't leave the token in .git/config
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Install mediainfo and Qt's libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mediainfo libegl1 libgl1 libxkbcommon0 libfontconfig1
      - name: Install mediainfo (macOS)
        if: runner.os == 'macOS'
        run: brew install media-info
      - name: Install mediainfo (Windows)
        if: runner.os == 'Windows'
        run: choco install mediainfo-cli --no-progress -y

      - name: mediainfo version
        run: mediainfo --Version
      - run: uv sync --locked
      - run: uv run pytest -ra
